# ──────────────────────────────────────────────────────────────────────────────
# IoT Gap-Filling Pipeline — runnable sample configuration
# Target: sensor 216, neighbour: sensor 255 (both in sample_data/).
# Neighbour distance is the haversine distance between the two sensors' coordinates.
# Usage: python run_pipeline.py --config config/config_sample.yaml
# Change file paths and device-specific values here; no code changes needed.
# ──────────────────────────────────────────────────────────────────────────────

timeline:
  frequency: 5min

execution:
  train_mode: true        # true = run tournament + train + save; false = load saved models

gaps:
  isolated_max: 1         # gaps of this size -> interpolation
  medium_max: 5           # gaps up to this size -> model; larger -> neighbor reconstruction

models:
  model_dir: models/sample/
  n_splits: 5

neighbor:
  quality_reference:
    - CorrectedTemp
    - CorrectedHumidity
    - CorrectedHeatIndex

validation:
  split_fraction: 0.8
  gap_sizes: [1, 2, 3, 5]
  n_gaps: 150
  seed: 42

# ── Reference variable used for gap classification ─────────────────────────────
reference:
  ref_col: CorrectedTemp

# ── Continuous variables to reconstruct (current + corrected) ──────────────────
continuous_variables:
  - CurrentTemperature
  - CorrectedTemp
  - CurrentHumidity
  - CorrectedHumidity
  - AtmPressure
  - WindSpeed

# ── PLACEHOLDER: per-variable max 5-minute change for continuity validation ────
jump_thresholds:
  CurrentTemperature: 3
  CorrectedTemp: 3
  CurrentHumidity: 10
  CorrectedHumidity: 10
  AtmPressure: 1.5
  WindSpeed: 10

# ── PLACEHOLDER: physical clip bounds [min, max] per variable ──────────────────
clipping_ranges:
  CurrentTemperature: [5, 55]
  CorrectedTemp: [5, 55]
  CurrentHumidity: [0, 100]
  CorrectedHumidity: [0, 100]
  AtmPressure: [940, 1060]
  WindSpeed: [0, 60]

# ── PLACEHOLDER: neighbour IDs and distances (km), same order ──────────────────
neighbor_distances:
  ids:
    - "255"
  distances_km:
    - 86.45

# ── PLACEHOLDER: input file paths ──────────────────────────────────────────────
input_paths:
  target_file: sample_data/Annam_216_new.csv
  neighbor_files:
    - sample_data/Annam_255_new.csv

# ── PLACEHOLDER: output file paths ─────────────────────────────────────────────
output_paths:
  output_dir: outputs/sample/
  filled_dataset: outputs/sample/filled_dataset.csv
  audit_report: outputs/sample/audit_report.csv
  evaluation_report: outputs/sample/evaluation_report.csv
  neighbor_quality_report: outputs/sample/neighbor_quality_report.csv
  model_selection_report: outputs/sample/model_selection_report.csv

# ── PLACEHOLDER: model hyperparameters (override per model; merged over defaults)
model_params:
  xgboost:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.05
  lightgbm:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.05
  randomforest:
    n_estimators: 100
    max_depth: 10
  knn:
    n_neighbors: 5

# ── Stored tournament result: best model per variable ──────────────────────────
# Persisted from training so inference mode is deterministic and model choices
# stay transparent without reading the Python code.
model_mapping:
  CorrectedTemp: XGBoost
  CorrectedHumidity: LightGBM
  AtmPressure: LightGBM
  WindSpeed: RandomForest
